name: Daily AI news

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      date:
        description: Optional ISO date to regenerate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ai-news-daily
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      ${{ github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 source: https://github.com/actions/checkout
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 source: https://github.com/actions/setup-python
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install .

      - name: Generate daily report
        env:
          LLM_PROTOCOL: ${{ vars.LLM_PROTOCOL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_AUTH_SCHEME: ${{ vars.LLM_AUTH_SCHEME || 'bearer' }}
          SITE_BASE_PATH: /ai-news/
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          python -m ai_news check-config
          run_date="${INPUT_DATE:-}"
          args=(--root .)
          if [[ -n "$run_date" ]]; then
            args+=(--date "$run_date")
          fi
          python -m ai_news generate "${args[@]}"

      - name: Stage generated data
        run: git add -- data content

      - name: Scan for secrets
        run: python scripts/check_no_secrets.py

      - name: Commit generated data
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: publish daily AI news"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Unable to rebase generated data onto current origin/main." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Push attempt $attempt of 3 failed; retrying." >&2
            else
              echo "Unable to publish generated data after 3 push attempts." >&2
              exit 1
            fi
          done
          echo "Push retry loop ended unexpectedly." >&2
          exit 1

  build:
    needs: generate
    if: >-
      ${{ always() && (needs.generate.result == 'success' ||
      needs.generate.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 source: https://github.com/actions/checkout
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 source: https://github.com/actions/setup-python
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install .

      - name: Build static site
        env:
          AI_NEWS_BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          export AI_NEWS_BUILD_SHA="$(git rev-parse HEAD)"
          python -m ai_news build --root . --output dist

      - name: Validate static site
        run: python scripts/validate_site.py dist --base-path /ai-news/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4 source: https://github.com/actions/upload-pages-artifact
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 source: https://github.com/actions/deploy-pages
