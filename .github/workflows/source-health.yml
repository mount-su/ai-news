name: Source health

on:
  pull_request:
    paths:
      - sources/feeds.yaml
      - "src/ai_news/collectors/**"
      - src/ai_news/http.py
      - src/ai_news/models.py
      - src/ai_news/source_health.py
      - scripts/check_source_health.py
      - .github/workflows/source-health.yml
  schedule:
    - cron: "17 7 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live-source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 source: https://github.com/actions/checkout

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 source: https://github.com/actions/setup-python
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install .

      - name: Check live source health
        run: python scripts/check_source_health.py
