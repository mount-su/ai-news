[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-news-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "bleach>=6.2,<7",
    "feedparser>=6,<7",
    "httpx>=0.28,<0.29",
    "jinja2>=3.1,<4",
    "pydantic>=2.11,<3",
    "python-dateutil>=2.9,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "respx>=0.22,<0.23",
    "ruff>=0.12,<0.13",
]

[project.scripts]
ai-news = "ai_news.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_news.site" = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
]

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
