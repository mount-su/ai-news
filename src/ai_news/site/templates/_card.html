{% macro news_card(item, report_date) -%}
  <article
    id="item-{{ item.id }}-{{ report_date }}"
    class="news-card"
    data-news-card
    data-item-id="{{ item.id }}"
  >
    <header class="news-card__header">
      <div class="news-card__labels">
        <span class="lane">{{ item.editorial_lane.value }}</span>
        <span class="category">{{ item.category.value|display_category }}</span>
      </div>
    </header>
    <div class="news-card__body">
      <h3>{{ item.title }}</h3>
      <p class="news-card__source">
        {{ item.source }}
        <span aria-hidden="true">·</span>
        <time datetime="{{ item.published_at.isoformat() }}">{{ item.published_at|beijing_datetime }}</time>
      </p>
      <dl class="brief-fields">
        <div><dt>变化</dt><dd>{{ item.summary }}</dd></div>
        <div><dt>影响</dt><dd>{{ item.why_it_matters }}</dd></div>
      </dl>
      <a
        class="source-link"
        href="{{ item.canonical_url }}"
        target="_blank"
        rel="noopener noreferrer"
      >查看原始来源 <span aria-hidden="true">↗</span></a>
    </div>
  </article>
{%- endmacro %}
