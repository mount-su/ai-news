{% extends "base.html" %}
{% from "_card.html" import news_card %}

{% block main %}
  <main id="main-content" class="page-shell">
    <section class="edition-heading" aria-labelledby="category-title">
      <p class="eyebrow">CATEGORY INTELLIGENCE</p>
      <h1 id="category-title">{{ category_name }}</h1>
      <p>跨日期聚合的 {{ category_name }} 编辑精选。</p>
    </section>
    <section class="brief-shell" aria-labelledby="feed-title">
      <div class="section-heading section-heading--brief">
        <p>CATEGORY SELECTION</p>
        <h2 id="feed-title">{{ category_name }} 情报</h2>
      </div>
      <ol class="news-list">
        {% for item in items %}
          <li>{{ news_card(item) }}</li>
        {% endfor %}
      </ol>
    </section>
  </main>
{% endblock %}
